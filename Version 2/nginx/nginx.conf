events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Standard security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Set file upload limits to support medical document uploads up to 50MB
    client_max_body_size 50M;

    upstream frontend {
        server frontend:3000;
    }

    upstream backend {
        server backend:5000;
    }

    server {
        listen 80;
        server_name localhost;

        # Healthcheck endpoint for proxy itself
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
        }

        # Route API requests to backend
        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            
            # Connection Upgrade headers for WebSocket support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # IP forwarding headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Prevent buffering for file uploads
            proxy_buffering off;
        }

        # Route all other requests to Next.js frontend
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            
            # Connection Upgrade headers for Next.js dev websocket and public WS
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
