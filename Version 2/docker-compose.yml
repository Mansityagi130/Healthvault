version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: healthvault-db
    environment:
      POSTGRES_DB: healthvault
      POSTGRES_USER: healthvault_user
      POSTGRES_PASSWORD: secure_dev_db_password_123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthvault_user -d healthvault"]
      interval: 5s
      timeout: 5s
      retries: 5
    # Do not expose ports publicly to maintain strict security isolation

  redis:
    image: redis:7-alpine
    container_name: healthvault-redis
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    # Do not expose ports publicly to maintain strict security isolation

  clamav:
    image: clamav/clamav:latest
    container_name: healthvault-clamav
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 3310 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Do not expose ports publicly to maintain strict security isolation

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: healthvault-backend
    environment:
      PORT: ${PORT:-5000}
      NODE_ENV: ${NODE_ENV:-development}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-healthvault_user}:${POSTGRES_PASSWORD:-secure_dev_db_password_123}@postgres:5432/${POSTGRES_DB:-healthvault}?schema=public}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      STORAGE_PATH: ${STORAGE_PATH:-/app/storage}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-super_secret_access_token_key_at_least_32_chars_long}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-super_secret_refresh_token_key_at_least_32_chars_long}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-super_secret_mfa_encryption_key_at_least_32_chars_long}
      SCANNER_PROVIDER: ${SCANNER_PROVIDER:-clamav}
      CLAMAV_HOST: ${CLAMAV_HOST:-clamav}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      EMAIL_MODE: ${EMAIL_MODE:-smtp}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-HealthVault Security <no-reply@healthvault.local>}
    volumes:
      - shared_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:5000/health/live').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 5
    # Do not expose ports publicly to maintain strict security isolation

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: healthvault-frontend
    environment:
      NODE_ENV: production
      PORT: 3000
    depends_on:
      backend:
        condition: service_healthy
    # Do not expose ports publicly to maintain strict security isolation

  nginx:
    image: nginx:alpine
    container_name: healthvault-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

  minio:
    image: minio/minio:latest
    container_name: healthvault-minio
    profiles:
      - storage
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  shared_storage:
  minio_data:
