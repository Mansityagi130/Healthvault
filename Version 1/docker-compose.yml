version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: healthvault-db
    environment:
      POSTGRES_DB: healthvault
      POSTGRES_USER: healthvault_user
      POSTGRES_PASSWORD: secure_dev_db_password_123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthvault_user -d healthvault"]
      interval: 5s
      timeout: 5s
      retries: 5
    # Do not expose ports publicly to maintain strict security isolation

  redis:
    image: redis:7-alpine
    container_name: healthvault-redis
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    # Do not expose ports publicly to maintain strict security isolation

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: healthvault-backend
    environment:
      PORT: 5000
      NODE_ENV: production
      FRONTEND_URL: http://localhost
      DATABASE_URL: postgresql://healthvault_user:secure_dev_db_password_123@postgres:5432/healthvault?schema=public
      REDIS_URL: redis://redis:6379
      STORAGE_PATH: /app/storage
      JWT_ACCESS_SECRET: super_secret_access_token_key_at_least_32_chars_long
      JWT_REFRESH_SECRET: super_secret_refresh_token_key_at_least_32_chars_long
      MFA_ENCRYPTION_KEY: super_secret_mfa_encryption_key_at_least_32_chars_long
    volumes:
      - shared_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:5000/health/live').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 5
    # Do not expose ports publicly to maintain strict security isolation

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: healthvault-frontend
    environment:
      NODE_ENV: production
      PORT: 3000
    depends_on:
      backend:
        condition: service_healthy
    # Do not expose ports publicly to maintain strict security isolation

  nginx:
    image: nginx:alpine
    container_name: healthvault-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  redis_data:
  shared_storage:
